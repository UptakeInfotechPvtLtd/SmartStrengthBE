<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark" />
        <title>New Enquiry - Smart Strength</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                background: #050505;
                color: #ffffff;
                font-family: Arial, Helvetica, sans-serif;
            }

            table {
                border-collapse: collapse;
            }

            .page {
                width: 100%;
                background: #050505;
                padding: 28px 14px;
            }

            .container {
                width: 100%;
                max-width: 560px;
                background: #090909;
                border: 1px solid #262626;
            }

            .header {
                padding: 24px 28px 16px;
                border-bottom: 1px solid #1f1f1f;
            }

            .brand {
                color: #00ff19;
                font-size: 24px;
                font-weight: 900;
                letter-spacing: 1px;
                text-transform: uppercase;
            }

            .content {
                padding: 26px 28px;
            }

            .title {
                color: #ffffff;
                font-size: 24px;
                font-weight: 900;
                line-height: 1.2;
                margin: 0 0 18px;
            }

            .badge {
                color: #00ff19;
                font-size: 13px;
                font-weight: 800;
                letter-spacing: 1px;
                margin-bottom: 14px;
                text-transform: uppercase;
            }

            .details {
                width: 100%;
                background: #101010;
                border: 1px solid #2f2f2f;
            }

            .details td {
                color: #d6d6d6;
                font-size: 14px;
                line-height: 1.5;
                padding: 11px 14px;
                border-bottom: 1px solid #242424;
                vertical-align: top;
            }

            .details td:first-child {
                color: #8f8f8f;
                width: 42%;
                font-weight: 700;
            }

            .footer {
                color: #777777;
                font-size: 12px;
                line-height: 1.6;
                padding: 18px 28px 24px;
                border-top: 1px solid #1f1f1f;
            }
        </style>
    </head>

    <body>
        <table class="page" role="presentation" width="100%" cellpadding="0" cellspacing="0">
            <tr>
                <td align="center">
                    <table
                        class="container"
                        role="presentation"
                        width="560"
                        cellpadding="0"
                        cellspacing="0"
                    >
                        <tr>
                            <td class="header">
                                <div class="brand">Smart Strength</div>
                            </td>
                        </tr>
                        <tr>
                            <td class="content">
                                <div class="badge">{{enquiryType}}</div>
                                <h1 class="title">New enquiry received</h1>
                                <table
                                    class="details"
                                    role="presentation"
                                    width="100%"
                                    cellpadding="0"
                                    cellspacing="0"
                                >
                                    <tr>
                                        <td>Name</td>
                                        <td>{{fullName}}</td>
                                    </tr>
                                    <tr>
                                        <td>Mobile</td>
                                        <td>{{mobileNumber}}</td>
                                    </tr>
                                    <tr>
                                        <td>Email</td>
                                        <td>{{email}}</td>
                                    </tr>
                                    <tr>
                                        <td>Preferred Center</td>
                                        <td>{{branchName}}</td>
                                    </tr>
                                    {{detailsRows}}
                                </table>
                            </td>
                        </tr>
                        <tr>
                            <td class="footer">
                                Please review and follow up with this enquiry from admin panel.
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
